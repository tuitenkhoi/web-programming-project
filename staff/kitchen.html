<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Màn hình bếp - Mộc Coffee</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
  <script src="../assets/js/admin-auth.js"></script>
</head>

<body class="staff-body" data-page="kitchen.html" data-perm="kitchen.view">
  <div class="staff-main">
    <div id="staff-shell"></div>
    <header id="staff-header" hidden></header>

    <main class="staff-content" id="staff-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 staff-title">Màn hình bếp</h1>
        <p class="text-secondary mb-0">Đơn mới hiện ở cột trái. Tự cập nhật khi có đơn mới.</p>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="sound-toggle" checked /><label class="form-check-label" for="sound-toggle"><i class="bi bi-bell me-1"></i>Âm báo</label></div>
        <button type="button" id="refresh" class="btn btn-light border" title="Làm mới"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div class="kitchen-board">
      <section class="kitchen-col"><h2>Chờ làm <span class="badge text-bg-danger" id="cnt-new">0</span></h2><div id="col-new"></div></section>
      <section class="kitchen-col"><h2>Đang làm <span class="badge text-bg-warning" id="cnt-preparing">0</span></h2><div id="col-preparing"></div></section>
      <section class="kitchen-col"><h2>Đã xong - chờ phục vụ <span class="badge text-bg-success" id="cnt-ready">0</span></h2><div id="col-ready"></div></section>
    </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/confirm-modal.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/staff-kitchen.js"></script>
</body>

</html>
