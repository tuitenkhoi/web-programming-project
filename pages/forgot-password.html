<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Khôi phục mật khẩu tài khoản Mộc Coffee." />
  <title>Quên mật khẩu - Mộc Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
  <link rel="stylesheet" href="../assets/css/mobile-fixes.css" />
  <script src="../assets/js/prefs.js"></script>
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#3e2723" />
  <link rel="apple-touch-icon" href="../assets/images/icons/icon-192.png" />
</head>
<body class="inner-page bg-light">
  <nav class="navbar navbar-dark bg-dark fixed-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-cup-hot-fill me-2"></i>Mộc Coffee</a>
      <a class="btn btn-outline-light btn-sm" href="account.html">Đăng nhập</a>
    </div>
  </nav>

  <main class="container py-5 account-main">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6">
        <div id="reset-alert" class="alert d-none" role="alert"></div>

        <!-- Bước 1: nhập email -->
        <div class="card border-0 shadow-sm" id="step-email"><div class="card-body p-4">
          <h1 class="h4 mb-3">Quên mật khẩu</h1>
          <p class="text-secondary">Nhập email đã đăng ký, chúng tôi sẽ gửi mã xác nhận gồm 6 số.</p>
          <form id="forgot-form" novalidate>
            <label class="form-label" for="forgot-email">Email</label>
            <input class="form-control mb-4" id="forgot-email" type="email" required maxlength="150" autocomplete="email" />
            <button class="btn btn-coffee w-100" type="submit">Gửi mã xác nhận</button>
          </form>
        </div></div>

        <!-- Bước 2: nhập mã OTP 6 số -->
        <div class="card border-0 shadow-sm d-none" id="step-otp"><div class="card-body p-4">
          <h1 class="h4 mb-3">Nhập mã xác nhận</h1>
          <p class="text-secondary">Mã gồm 6 số đã được gửi tới <strong id="otp-email"></strong> (hiệu lực 10 phút).</p>
          <form id="otp-form" novalidate>
            <div class="d-flex justify-content-between gap-2 mb-4" id="otp-boxes">
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 1" autocomplete="one-time-code" />
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 2" />
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 3" />
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 4" />
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 5" />
              <input class="form-control text-center fs-4 otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Chữ số 6" />
            </div>
            <button class="btn btn-coffee w-100" type="submit">Xác nhận</button>
          </form>
          <button id="otp-back" class="btn btn-link w-100 mt-2" type="button">Nhập lại email / gửi lại mã</button>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/password-reset.js"></script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
