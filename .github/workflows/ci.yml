name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra cú pháp và marker Git
        run: npm run check

      - name: Chạy kiểm thử tự động
        run: npm test

      - name: Xuất báo cáo coverage
        run: npm run test:coverage
