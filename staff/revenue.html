<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Doanh thu - Mộc Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
  <script src="../assets/js/admin-auth.js"></script>
</head>

<body class="staff-body" data-page="revenue.html" data-perm="revenue.view">
  <header id="staff-header"></header>

  <main id="staff-content" class="staff-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 staff-title">Doanh thu</h1>
        <p class="text-secondary mb-0">Doanh thu tính trên các đơn đã thanh toán (không tính đơn đã hủy).</p>
      </div>
      <div class="d-flex gap-2">
        <div class="btn-group" id="rev-period" role="group" aria-label="Khoảng thời gian">
          <button type="button" class="btn btn-outline-secondary active" data-period="7-days">7 ngày</button>
          <button type="button" class="btn btn-outline-secondary" data-period="30-days">30 ngày</button>
          <button type="button" class="btn btn-outline-secondary" data-period="12-months">12 tháng</button>
        </div>
        <button type="button" id="rev-refresh" class="btn btn-light border" title="Làm mới"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3"><div class="staff-card p-3 h-100"><div class="text-secondary small">Doanh thu hôm nay</div><div class="fs-4 fw-bold text-success" id="k-today">0đ</div><div class="small" id="k-compare"></div></div></div>
      <div class="col-6 col-lg-3"><div class="staff-card p-3 h-100"><div class="text-secondary small">Hôm qua</div><div class="fs-4 fw-bold" id="k-yesterday">0đ</div></div></div>
      <div class="col-6 col-lg-3"><div class="staff-card p-3 h-100"><div class="text-secondary small" id="k-period-label">Tổng 7 ngày</div><div class="fs-4 fw-bold" id="k-period">0đ</div></div></div>
      <div class="col-6 col-lg-3"><div class="staff-card p-3 h-100"><div class="text-secondary small">Đơn đã thanh toán hôm nay</div><div class="fs-4 fw-bold" id="k-paid">0</div><div class="small text-secondary" id="k-awaiting"></div></div></div>
    </div>

    <div class="staff-card p-3 mb-3">
      <h2 class="h6 fw-bold mb-3">Doanh thu theo <span id="rev-unit">ngày</span></h2>
      <div id="rev-chart" class="d-flex align-items-end gap-1" style="height:220px;overflow-x:auto"></div>
    </div>

    <div class="staff-card p-3">
      <h2 class="h6 fw-bold mb-3">Hóa đơn đã thanh toán gần đây</h2>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Mã đơn</th><th>Thời gian</th><th>Bàn / Hình thức</th><th>Thanh toán</th><th class="text-end">Tổng tiền</th><th></th></tr></thead>
          <tbody id="rev-invoices"><tr><td colspan="6" class="text-center text-secondary py-4">Đang tải...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/confirm-modal.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/staff-print.js"></script>
  <script src="../assets/js/staff-revenue.js"></script>
</body>

</html>
