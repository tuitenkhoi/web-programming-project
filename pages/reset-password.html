<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Khôi phục mật khẩu tài khoản Mộc Coffee." />
  <title>Đặt lại mật khẩu - Mộc Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
  <link rel="stylesheet" href="../assets/css/mobile-fixes.css" />
  <script src="../assets/js/prefs.js"></script>
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#3e2723" />
  <link rel="apple-touch-icon" href="../assets/images/icons/icon-192.png" />
</head>
<body class="inner-page bg-light">
  <nav class="navbar navbar-dark bg-dark fixed-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-cup-hot-fill me-2"></i>Mộc Coffee</a>
      <a class="btn btn-outline-light btn-sm" href="account.html">Đăng nhập</a>
    </div>
  </nav>

  <main class="container py-5 account-main">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6">
        <div id="reset-alert" class="alert d-none" role="alert"></div>

        <!-- Bước 3: đặt mật khẩu mới (cần reset_ticket từ bước xác nhận OTP) -->
        <div class="card border-0 shadow-sm" id="step-password"><div class="card-body p-4">
          <h1 class="h4 mb-3">Đặt lại mật khẩu</h1>
          <form id="reset-form" novalidate>
            <label class="form-label" for="new-password">Mật khẩu mới</label>
            <input class="form-control mb-3" id="new-password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" />
            <label class="form-label" for="confirm-password">Nhập lại mật khẩu mới</label>
            <input class="form-control mb-4" id="confirm-password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" />
            <button class="btn btn-coffee w-100" type="submit">Đổi mật khẩu</button>
          </form>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/password-reset.js"></script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
