<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Topping - Mộc Coffee</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
  <script src="../assets/js/admin-auth.js"></script>
</head>

<body class="staff-body" data-page="toppings.html" data-perm="toppings.manage">
  <div class="staff-main">
    <div id="staff-shell"></div>
    <header id="staff-header" hidden></header>

    <main class="staff-content" id="staff-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 staff-title">Topping</h1>
        <p class="text-secondary mb-0">Bật/tắt topping khi hết nguyên liệu, thêm topping mới hoặc chọn topping dành cho món nào. Bếp không xóa được topping.</p>
      </div>
    </div>
    <div class="staff-card p-3 topping-staff" data-topping-manager>
      <form class="row g-2 mb-2" data-topping-add-form novalidate>
        <div class="col-12 col-sm">
          <label for="topping-name-input" class="visually-hidden">Tên topping mới</label>
          <input type="text" id="topping-name-input" class="form-control" maxlength="50" placeholder="Tên topping, ví dụ: Trân châu" data-topping-name />
        </div>
        <div class="col-7 col-sm-4">
          <label for="topping-price-input" class="visually-hidden">Giá topping (đồng)</label>
          <input type="text" id="topping-price-input" class="form-control" inputmode="numeric" placeholder="Giá (đồng)" data-topping-price />
        </div>
        <div class="col-5 col-sm-auto">
          <button type="submit" class="btn btn-coffee w-100 text-nowrap">Thêm</button>
        </div>
      </form>
      <p class="text-danger small d-none" role="alert" data-topping-error></p>
      <ul class="list-unstyled mb-0" data-topping-list><li class="text-secondary py-3">Đang tải topping...</li></ul>
    </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/confirm-modal.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/admin-toppings.js"></script>
  <script src="../assets/js/staff-toppings.js"></script>
</body>

</html>
