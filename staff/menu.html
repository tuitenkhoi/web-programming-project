<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Hết món - Mộc Coffee</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
  <script src="../assets/js/admin-auth.js"></script>
</head>

<body class="staff-body" data-page="menu.html" data-perm="products.soldout">
  <header id="staff-header"></header>

  <main id="staff-content" class="staff-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 staff-title">Hết món hôm nay</h1>
        <p class="text-secondary mb-0">Bật "Hết món" khi quán không còn nguyên liệu. Khách và nhân viên sẽ không đặt được món đó trong hôm nay, sang ngày mới món tự bán lại.</p>
      </div>
      <div class="d-flex gap-2">
        <input id="sold-search" type="search" class="form-control" placeholder="Tìm món..." style="max-width:220px" />
        <button type="button" id="sold-refresh" class="btn btn-light border" title="Làm mới"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-3" id="sold-cats"></div>
    <div class="small text-secondary mb-2" id="sold-summary"></div>
    <div id="sold-grid" class="pos-menu-grid"><div class="text-secondary py-4">Đang tải thực đơn...</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/confirm-modal.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/staff-menu.js"></script>
</body>

</html>
