<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sơ đồ bàn - Mộc Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
  <script src="../assets/js/admin-auth.js"></script>
</head>

<body class="staff-body" data-page="index.html" data-perm="tables.view">
  <header id="staff-header"></header>

  <main id="staff-content" class="staff-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 staff-title">Sơ đồ bàn</h1>
        <p class="text-secondary mb-0">Trạng thái bàn cập nhật tự động.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <div class="btn-group" id="table-filter" role="group" aria-label="Lọc bàn">
          <button type="button" class="btn btn-outline-secondary active" data-filter="all">Tất cả <span class="badge text-bg-secondary" id="cnt-all">0</span></button>
          <button type="button" class="btn btn-outline-secondary" data-filter="available">Trống <span class="badge text-bg-success" id="cnt-available">0</span></button>
          <button type="button" class="btn btn-outline-secondary" data-filter="occupied">Có khách <span class="badge text-bg-danger" id="cnt-occupied">0</span></button>
          <button type="button" class="btn btn-outline-secondary" data-filter="maintenance">Bảo trì <span class="badge text-bg-secondary" id="cnt-maintenance">0</span></button>
        </div>
        <button type="button" id="refresh" class="btn btn-light border" title="Làm mới"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div id="table-areas"><div class="text-center text-secondary py-5">Đang tải sơ đồ bàn...</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/confirm-modal.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/staff-print.js"></script>
  <script src="../assets/js/staff-tables.js"></script>
</body>

</html>
